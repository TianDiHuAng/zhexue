name: Deploy to GitHub Pages

# 站点是纯静态 HTML+CSS（零 JS、离线可用），由 tools/gen_site.py 从 data/*.json 确定性生成。
# 本工作流：跑校验 → 生成 site/ → 上传 artifact → 发布到 GitHub Pages。
#
# 说明：GitHub Pages 的「创建部署」接口偶发 500（annotation 原文即建议"稍后重跑"）。
# 故 deploy 采用「失败 → 等 15 秒 → 重试一次」的写法，把瞬时故障兜住；
# 两次都失败才判定为真失败（末步 exit 1）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 查重（必须零重复）
        run: python tools/dupcheck.py
        # D61：检查 id／人物中文名／人物拉丁名／著作与比较篇标题／概念术语五类重复

      - name: 来源登记自洽（结构体检，D67）
        run: python tools/srccheck.py

      - name: 引用有效性（必须全部可解析）
        run: python tools/refcheck.py
        # D62：检查所有指向 id 的引用是否落在全库已有 id 上（跨单元亦须存在）

      - name: 数据校验（必须零错误）
        run: |
          python tools/check.py
          # check.py 以非零退出码表示有错误；警告为信息性（见 DECISIONS D23）

      - name: 生成站点
        run: |
          python tools/gen_state.py
          python tools/gen_site.py

      - name: 断链检查（必须零断链）
        run: python tools/check_links.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages（首次尝试）
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 等待 15 秒（Pages 偶发 5xx 退避）
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: 重试部署（一次）
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: 判定结果（两次都失败才算失败）
        if: always()
        run: |
          first="${{ steps.deployment.outcome }}"
          retry="${{ steps.deployment_retry.outcome }}"
          echo "首次：$first；重试：$retry"
          if [ "$first" = "failure" ] && [ "$retry" != "success" ]; then
            echo "::error::GitHub Pages 部署两次均失败，请查看 annotation 与 githubstatus.com"
            exit 1
          fi
          echo "部署成功（首次=$first，重试=$retry）"
